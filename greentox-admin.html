async function sGet(key) {
  try {
    const r = await fetch(FB_URL + '/' + key + '.json');
    if (!r.ok) throw new Error();
    const data = await r.json();
    // Products come as object {id: product} from Firebase
    if(key === 'products' && data && typeof data === 'object' && !Array.isArray(data)){
      return Object.values(data).filter(Boolean);
    }
    return data;
  } catch {
    try { const v = localStorage.getItem('gt_'+key); return v ? JSON.parse(v) : null; } catch { return null; }
  }
}
async function sSet(key, val) {
  try {
    if(key === 'products' && Array.isArray(val)){
      // Save each product individually to avoid Firebase size limits
      const obj = {};
      val.forEach(p => { if(p && p.id) obj[p.id] = p; });
      await fetch(FB_URL + '/products.json', {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(obj)
      });
    } else {
      await fetch(FB_URL + '/' + key + '.json', {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(val)
      });
    }
    localStorage.setItem('gt_'+key, JSON.stringify(val));
  } catch(err) {
    console.error('sSet error:', key, err);
    try { localStorage.setItem('gt_'+key, JSON.stringify(val)); } catch {}
  }
}

// Save a single product immediately to Firebase
async function saveProductNow(prod) {
  if(!prod || !prod.id) return;
  try {
    await fetch(FB_URL + '/products/' + prod.id + '.json', {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(prod)
    });
    localStorage.setItem('gt_product_'+prod.id, JSON.stringify(prod));
    console.log('Product saved:', prod.name);
  } catch(err) {
    console.error('saveProductNow error:', err);
  }
}

async function uploadToCloudinary(base64, productName) {
  const CLOUD_NAME = 'dlkjan5b0';
  const UPLOAD_PRESET = 'greentox_products'; // unsigned preset
  try {
    const formData = new FormData();
    formData.append('file', base64);
    formData.append('upload_preset', UPLOAD_PRESET);
    formData.append('folder', 'greentox/products');
    formData.append('public_id', 'product_'+Date.now());
    const r = await fetch('https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/image/upload', {
      method: 'POST', body: formData
    });
    const data = await r.json();
    if(data.secure_url) return data.secure_url+'?w=600&q=auto&f=auto';
    throw new Error('No URL returned');
  } catch(e) {
    console.warn('Cloudinary upload failed, using base64:', e);
    return base64; // fallback to base64
  }
}

function fileToBase64(file) {
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = ()=>rej(new Error("Error leyendo archivo"));
    r.readAsDataURL(file);
  });
}

function Btn({children,onClick,color=G.primary,small=false,danger=false,outline=false,full=false,disabled=false}){
  const bg = danger?G.red:outline?"white":color;
  const txt = outline?(danger?G.red:color):"white";
  const border = outline?`2px solid ${danger?G.red:color}`:"none";
  return <button onClick={onClick} disabled={disabled} style={{background:bg,color:txt,border,borderRadius:10,padding:small?"6px 12px":"10px 20px",fontWeight:700,fontSize:small?12:14,cursor:disabled?"not-allowed":"pointer",opacity:disabled?.5:1,width:full?"100%":"auto",transition:"all .15s",fontFamily:"inherit"}}>{children}</button>;
}

function Input({label,value,onChange,type="text",placeholder="",small=false}){

function ImageUploader({value,onChange,label="Imagen",size=100}){
  const ref = useRef();
  const handleFile = async e=>{
    const f = e.target.files[0]; if(!f) return;
    const b64 = await fileToBase64(f);
    onChange(b64);
  };
  return <div>
    {label&&<div style={{fontSize:11,fontWeight:700,color:G.gray,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>{label}</div>}

function StoreMap({settings, update}) {
  const mapRef = React.useRef(null);
  const markerRef = React.useRef(null);
  const mapInstRef = React.useRef(null);
  const SCZ = [-17.7863, -63.1812];

  const greenIcon = () => L.divIcon({
    html: '<div style="width:36px;height:36px;background:linear-gradient(135deg,#1B4332,#2D6A4F);border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid white;box-shadow:0 4px 14px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center"><span style="transform:rotate(45deg);font-size:14px;display:block;margin-top:-2px">🏪</span></div>',
    className:'', iconSize:[36,36], iconAnchor:[18,36]
  });

  React.useEffect(() => {
    if(mapInstRef.current) return;
    const lat = parseFloat(settings.storeLat) || SCZ[0];
    const lng = parseFloat(settings.storeLng) || SCZ[1];
    const map = L.map(mapRef.current, {center:[lat,lng], zoom:14, zoomControl:false});
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
      attribution:'© OpenStreetMap © CartoDB', subdomains:'abcd', maxZoom:19
    }).addTo(map);
    L.control.zoom({position:'topright'}).addTo(map);
    mapInstRef.current = map;

    // Place initial marker if coords exist
    if(settings.storeLat && settings.storeLng) {
      markerRef.current = L.marker([lat,lng], {icon:greenIcon(), draggable:true}).addTo(map);
      markerRef.current.on('dragend', e => {
        const pos = e.target.getLatLng();
        update('storeLat', parseFloat(pos.lat.toFixed(6)));
        update('storeLng', parseFloat(pos.lng.toFixed(6)));
      });
    }

    map.on('click', e => {
      const {lat, lng} = e.latlng;
      if(markerRef.current) map.removeLayer(markerRef.current);
      markerRef.current = L.marker([lat,lng], {icon:greenIcon(), draggable:true}).addTo(map);
      markerRef.current.on('dragend', ev => {
        const pos = ev.target.getLatLng();
        update('storeLat', parseFloat(pos.lat.toFixed(6)));
        update('storeLng', parseFloat(pos.lng.toFixed(6)));
      });
      update('storeLat', parseFloat(lat.toFixed(6)));
      update('storeLng', parseFloat(lng.toFixed(6)));
    });
  }, []);

  const geoLocate = () => {
    if(!navigator.geolocation) return alert('GPS no disponible');
    navigator.geolocation.getCurrentPosition(pos => {
      const {latitude:lat, longitude:lng} = pos.coords;
      mapInstRef.current.setView([lat,lng], 17);
      if(markerRef.current) mapInstRef.current.removeLayer(markerRef.current);
      markerRef.current = L.marker([lat,lng], {icon:greenIcon(), draggable:true}).addTo(mapInstRef.current);
      markerRef.current.on('dragend', e => {
        const p = e.target.getLatLng();
        update('storeLat', parseFloat(p.lat.toFixed(6)));
        update('storeLng', parseFloat(p.lng.toFixed(6)));
      });
      update('storeLat', parseFloat(lat.toFixed(6)));
      update('storeLng', parseFloat(lng.toFixed(6)));
    }, () => alert('No se pudo obtener ubicación. Activa el GPS.'));
  };

  return React.createElement('div',null,
    React.createElement('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}},
      React.createElement('div',{style:{fontSize:13,color:'#6B7280',fontWeight:600}},'Toca el mapa o arrastra el pin 🏪'),
      React.createElement('button',{onClick:geoLocate,style:{background:'#2D6A4F',color:'white',border:'none',borderRadius:8,padding:'7px 14px',fontWeight:700,fontSize:12,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:5}},
        '📱 Usar mi GPS'
      )
    ),
    React.createElement('div',{ref:mapRef, id:'storeMapEl'})
  );
}

function PedidosTab({orders, setOrders, showToast}){
  const ESTADOS = ['pendiente','confirmado','en camino','entregado','cancelado'];
  const COLORES = {pendiente:'#FF9800',confirmado:'#2196F3','en camino':'#9C27B0',entregado:'#4CAF50',cancelado:'#F44336'};

  const updateEstado = async (id, estado) => {
    setOrders(prev => prev.map(o => o.id===id ? {...o, estado} : o));
    try {
      await fetch(FB_URL+'/orders/'+id+'/estado.json', {
        method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(estado)
      });
      showToast('Estado actualizado');
    } catch { showToast('Error al guardar','error'); }
  };

  const pendientes = orders.filter(o=>o.estado==='pendiente').length;
  const enCamino  = orders.filter(o=>o.estado==='en camino').length;

  if(orders.length===0) return (
    <div style={{textAlign:'center',padding:'60px 20px',background:'white',borderRadius:16,color:'#9CA3AF'}}>
      <div style={{fontSize:48,marginBottom:12}}>📋</div>
      <div style={{fontWeight:700,fontSize:16}}>Sin pedidos aún</div>
      <div style={{fontSize:13,marginTop:8}}>Aquí verás los pedidos cuando tus clientes compren</div>
    </div>
  );

  return (
    <div>
      {/* Resumen */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:20}}>
        {[
          ['📋',orders.length,'Total','#6B7280'],
          ['⏳',pendientes,'Pendientes','#FF9800'],
          ['🚛',enCamino,'En camino','#9C27B0'],
          ['✅',orders.filter(o=>o.estado==='entregado').length,'Entregados','#4CAF50'],
        ].map(([icon,n,lbl,color])=>(
          <div key={lbl} style={{background:'white',borderRadius:12,padding:'12px 8px',textAlign:'center',boxShadow:'0 2px 8px rgba(0,0,0,.06)'}}>
            <div style={{fontSize:22}}>{icon}</div>
            <div style={{fontSize:22,fontWeight:900,color}}>{n}</div>
            <div style={{fontSize:10,color:'#9CA3AF',marginTop:2}}>{lbl}</div>
          </div>
        ))}
      </div>

      {/* Lista pedidos */}
      <div style={{display:'grid',gap:14}}>
        {[...orders].sort((a,b)=>b.id-a.id).map(o=>(
          <div key={o.id} style={{background:'white',borderRadius:16,overflow:'hidden',boxShadow:'0 2px 12px rgba(0,0,0,.07)'}}>
            {/* Header */}
            <div style={{background:COLORES[o.estado]||'#9CA3AF',padding:'10px 16px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div style={{color:'white',fontWeight:900,fontSize:13}}>
                👤 {o.cliente?.nombre||'—'} · 📱 {o.cliente?.whatsapp||'—'}
              </div>
              <div style={{color:'white',fontWeight:900,fontSize:15}}>Bs. {o.total}</div>
            </div>
            {/* Body */}
            <div style={{padding:'14px 16px'}}>
              <div style={{fontSize:12,color:'#9CA3AF',marginBottom:8}}>{o.fecha||'—'} · 💳 {o.pago||'—'}</div>
              {/* Items */}
              <div style={{background:'#F9FBF9',borderRadius:10,padding:'10px 12px',marginBottom:10,fontSize:13}}>
                {(o.items||[]).map((item,i)=>(
                  <div key={i} style={{color:'#374151',marginBottom:2}}>
                    • {item.producto} x{item.qty} ({item.plan}) — Bs. {item.precio}
                  </div>
                ))}
              </div>
              {/* Ubicacion */}
              {o.ubicacion && (
                <a href={o.ubicacion} target="_blank" style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:12,color:'#1A5C20',fontWeight:700,textDecoration:'none',marginBottom:10}}>
                  📍 Ver ubicación en Google Maps
                </a>
              )}
              {/* Reciclaje */}
              {o.reciclaje && (
                <div style={{background:'#E8F5E9',border:'1.5px solid #A5D6A7',borderRadius:10,padding:'8px 12px',marginBottom:10,fontSize:12,color:'#1A5C20'}}>
                  ♻️ <b>Pide recolección de botellas</b> · Cantidad: {o.reciclaje.cantidad} · Dirección: {o.reciclaje.direccion||'misma entrega'}
                </div>
              )}
              {/* Estado buttons */}
              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                {ESTADOS.map(e=>(
                  <button key={e} onClick={()=>updateEstado(o.id,e)} style={{
                    padding:'6px 12px',borderRadius:8,fontWeight:700,fontSize:11,cursor:'pointer',fontFamily:'inherit',
                    border:'2px solid '+(o.estado===e?COLORES[e]:'#E5E7EB'),
                    background:o.estado===e?COLORES[e]:'white',
                    color:o.estado===e?'white':'#6B7280'
                  }}>{e}</button>
                ))}
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App(){
  const [ready,setReady] = useState(false);
  const [logged,setLogged] = useState(false);
  const [tab,setTab] = useState("products");
  const [products,setProducts] = useState([]);
  const [settings,setSettings] = useState(DEFAULT_SETTINGS);
  const [logos,setLogos] = useState({dark:"",light:""});
  const [toast,setToast] = useState({msg:"",type:"success"});
  const [saving,setSaving] = useState(false);
  const [orders,setOrders] = useState([]);

  useEffect(()=>{
    (async()=>{
      const [sp,ss,sl,so] = await Promise.all([sGet("products"),sGet("settings"),sGet("logos"),sGet("orders")]);
      if(so){ const arr=Array.isArray(so)?so:Object.values(so).filter(Boolean); setOrders(arr.sort((a,b)=>b.id-a.id)); }
      if(sp && Array.isArray(sp)) setProducts(sp);
      else if(sp && typeof sp==="object") setProducts(Object.values(sp).filter(Boolean));
      if(ss) setSettings(s=>({...DEFAULT_SETTINGS,...ss}));
      if(sl && (sl.dark || sl.light)) setLogos(sl);
      else setLogos({dark: DEFAULT_LOGO, light: ''});
      setReady(true);
    })();
  },[]);

  useEffect(()=>{ if(ready) sSet("products",products); },[products,ready]);
  useEffect(()=>{ if(ready) sSet("settings",settings); },[settings,ready]);
  useEffect(()=>{ if(ready) sSet("logos",logos); },[logos,ready]);

  const showToast = (msg,type="success")=>{
    setToast({msg,type});
    setTimeout(()=>setToast({msg:"",type:"success"}),3000);
  };

  const handleSaveAll = ()=>{
    setSaving(true);
    sSet("products",products);sSet("settings",settings);sSet("logos",logos);
    setSaving(false);
    showToast("¡Todo guardado!");
  };

  if(!logged) return <Login onLogin={()=>setLogged(true)} adminPwd={settings.adminPassword}/>;

  const TABS=[
    {key:"products",label:"Productos",icon:"📦"},
    {key:"settings",label:"Config",icon:"⚙️"},
    {key:"pagos",label:"Pagos",icon:"💳"},
    {key:"identidad",label:"Marca",icon:"🎨"},
    {key:"seguridad",label:"Seguridad",icon:"🔐"},
    {key:"pedidos",label:"Pedidos",icon:"📋"},
    {key:"delivery",label:"Delivery",icon:"🚛"},
    {key:"diseno",label:"Diseño",icon:"🎨"},
  ];

  return <div style={{minHeight:"100vh",background:"#F0F4F0"}}>
    {/* Header */}
    <div style={{background:"#1A5C20",color:"white",padding:"0 16px",display:"flex",alignItems:"center",justifyContent:"space-between",height:56,position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 10px rgba(0,0,0,.2)"}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        {logos.dark?<img src={logos.dark} alt="" style={{height:32,objectFit:"contain",filter:"brightness(10)"}}/>:<span style={{fontSize:24}}>🌿</span>}
        <div>
          <div style={{fontWeight:900,fontSize:14}}>GreenTox SC</div>
          <div style={{fontSize:10,opacity:.7}}>Panel Admin</div>
        </div>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <button onClick={handleSaveAll} disabled={saving} style={{background:'linear-gradient(135deg,#E53935,#FB8C00)',color:'white',border:'none',borderRadius:10,padding:'7px 14px',fontWeight:800,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>
          {saving?"⏳":"💾"} Guardar
        </button>
        <button onClick={()=>setLogged(false)} style={{background:"rgba(255,255,255,.15)",color:"white",border:"none",borderRadius:10,padding:"7px 12px",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>
          🚪
        </button>
      </div>
    </div>

    {/* Tab bar (horizontal en móvil) */}
    <div style={{background:"white",borderBottom:"1px solid #e5e5e5",display:"flex",overflowX:"auto",padding:"0 8px"}}>
      {TABS.map(t=><button key={t.key} onClick={()=>setTab(t.key)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"10px 16px",border:"none",cursor:"pointer",fontFamily:"inherit",fontWeight:tab===t.key?800:500,fontSize:11,background:"transparent",color:tab===t.key?"#1A5C20":G.gray,borderBottom:`3px solid ${tab===t.key?"#E53935":"transparent"}`,whiteSpace:"nowrap",transition:"all .15s"}}>
        <span style={{fontSize:18}}>{t.icon}</span>{t.label}
      </button>)}
    </div>

    {/* Content */}
    <div style={{padding:16,maxWidth:720,margin:"0 auto"}}>
      {/* Resumen */}
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        {[["📦",products.length,"productos"],["✅",products.filter(p=>p.inStock).length,"en stock"],["❌",products.filter(p=>!p.inStock).length,"agotados"]].map(([icon,n,lbl])=>
          <div key={lbl} style={{flex:1,background:"white",borderRadius:12,padding:"10px",textAlign:"center",boxShadow:"0 2px 8px rgba(0,0,0,.05)"}}>
            <div style={{fontSize:20}}>{icon}</div>
            <div style={{fontSize:22,fontWeight:900,color:G.dark}}>{n}</div>
            <div style={{fontSize:10,color:G.gray}}>{lbl}</div>
          </div>
        )}
      </div>
      {tab==="products"&&<ProductsTab products={products} setProducts={setProducts} showToast={showToast} settings={settings}/>}
      {tab==="settings"&&<SettingsTab settings={settings} setSettings={setSettings}/>}
      {tab==="pagos"&&<PagosTab settings={settings} setSettings={setSettings}/>}
      {tab==="identidad"&&<IdentidadTab logos={logos} setLogos={setLogos}/>}
      {tab==="seguridad"&&<SeguridadTab settings={settings} setSettings={setSettings} showToast={showToast}/>}
      {tab==="pedidos"&&<PedidosTab orders={orders} setOrders={setOrders} showToast={showToast}/>}
      {tab==="delivery"&&<DeliveryTab settings={settings} setSettings={setSettings}/>}
      {tab==="diseno"&&<DisenoTab settings={settings} setSettings={setSettings} showToast={showToast} logos={logos} setLogos={setLogos}/>}
    </div>
    <Toast msg={toast.msg} type={toast.type}/>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
